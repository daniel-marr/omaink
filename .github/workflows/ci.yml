name: CI
on:
  push:
  pull_request:

# Builds and unit tests only. This job cannot and does not establish live
# Omarchy/Hyprland desktop acceptance; that is recorded manually in
# VERIFICATION.md on real hardware. Runs in an Arch Linux container because
# OmaInk needs GTK 4.18+ and libadwaita 1.6+ (newer than Ubuntu runners).
jobs:
  build-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and GTK4 + libadwaita
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita desktop-file-utils xorg-server-xvfb
      - uses: actions/checkout@v4
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Unit tests (GTK tests under a virtual display)
        run: xvfb-run -a cargo test --workspace --locked
      - name: Validate desktop entry
        run: desktop-file-validate packaging/co.think3.OmaInk.desktop
