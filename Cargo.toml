[workspace]
resolver = "2"
members = [
    "crates/omaink-core",
    "crates/omaink-ink",
    "crates/omaink-store",
    "crates/omaink-theme",
    "crates/omaink-gtk",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["Daniel Marr (think3.co)"]
license = "GPL-3.0-or-later"
repository = "https://github.com/daniel-marr/omaink"
rust-version = "1.92"

[workspace.dependencies]
omaink-core = { path = "crates/omaink-core" }
omaink-ink = { path = "crates/omaink-ink" }
omaink-store = { path = "crates/omaink-store" }
omaink-theme = { path = "crates/omaink-theme" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kurbo = { version = "0.11", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
uuid = { version = "1.10", features = ["v7", "serde"] }
thiserror = "2.0"
freedraw = "1.0"
rstar = "0.12"
zstd = "0.13"
tempfile = "3.10"
toml = "0.8"
tracing = "0.1"

gtk4 = { version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_6"] }

[profile.release]
lto = "thin"
